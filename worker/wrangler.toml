name = "sopcheck-ai"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

# CORS allow-list (comma separated). Production = the Pages preview only.
[vars]
ALLOWED_ORIGINS = "https://pocketappstudio.github.io"
DAILY_CAP_USD = "0.50"
IP_HOURLY_CALLS = "10"
IP_DAILY_CALLS = "30"

# KV namespace id is injected by deploy-worker.sh (it creates the namespace). OPENAI_API_KEY is a secret, never in this file.
[[kv_namespaces]]
binding = "RL"
id = "__KV_ID__"

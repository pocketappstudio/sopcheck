# To use: copy to .github/workflows/pages.yml (needs a token/account with the "workflow" permission).
# Static frontend -> GitHub Pages. Repo Settings > Pages > Source: GitHub Actions.
# Repo Settings > Secrets and variables > Actions > Variables:
#   SOPCHECK_API_BASE  = https://<your-api-host>          (Render/Fly URL, no trailing slash)
#   SOPCHECK_BASE_PATH = /<repo-name>   for https://<user>.github.io/<repo-name>/ ; leave EMPTY for a custom domain
name: Deploy frontend to GitHub Pages
# The public preview is the in-browser demo published to the gh-pages branch (frontend/scripts_build_demo.sh).
# Run this workflow manually only once a real API is deployed and Pages is switched to "GitHub Actions".
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx next build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_API_BASE: ${{ vars.SOPCHECK_API_BASE }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.SOPCHECK_BASE_PATH }}
          NEXT_PUBLIC_SHOW_DEMO_ACCOUNTS: "false"
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
